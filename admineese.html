<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Upload Photo for Login Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: #f5efe9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .admin-card { max-width: 460px; width: 100%; background: #fcf8f5; border-radius: 32px; box-shadow: 0 20px 48px rgba(120, 90, 70, 0.20); padding: 28px 24px 32px; border: 1px solid #ede5dc; }
        .admin-card h1 { font-size: 26px; font-weight: 600; color: #3d2e26; display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        .admin-card h1 i { font-size: 28px; color: #a8836b; }
        .sub { color: #7a6152; font-size: 14px; margin-bottom: 22px; padding-bottom: 14px; border-bottom: 1px solid #e1d3c8; }
        .upload-area { background: #f9f3ee; border: 2px dashed #d4b8a0; border-radius: 20px; padding: 24px 16px; text-align: center; cursor: pointer; transition: 0.2s; margin-bottom: 18px; }
        .upload-area:hover { background: #efe6dd; border-color: #b8977e; }
        .upload-area i { font-size: 42px; color: #b3927c; margin-bottom: 8px; }
        .upload-area p { color: #6b4f3e; font-size: 15px; font-weight: 500; }
        .upload-area span { font-size: 13px; color: #8f7564; display: block; margin-top: 4px; }
        #photoInput { display: none; }
        .preview-box { margin: 16px 0 20px; border-radius: 20px; overflow: hidden; border: 1px solid #e1d3c8; background: #efe6dd; min-height: 140px; display: flex; align-items: center; justify-content: center; position: relative; }
        .preview-box img { width: 100%; height: auto; max-height: 220px; object-fit: cover; display: block; }
        .preview-box .placeholder-text { color: #b3927c; font-size: 14px; padding: 30px 10px; text-align: center; }
        .btn { background: #d4b8a0; color: #2f221c; border: none; padding: 15px 24px; border-radius: 40px; font-weight: 600; font-size: 16px; width: 100%; cursor: pointer; transition: 0.2s; box-shadow: 0 6px 18px rgba(180, 140, 115, 0.25); display: flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid rgba(255, 240, 230, 0.4); margin-bottom: 10px; }
        .btn:hover { background: #c9ad96; transform: scale(0.98); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn.secondary { background: #e6d9cf; color: #3d2e26; box-shadow: none; font-weight: 500; margin-bottom: 0; }
        .btn.secondary:hover { background: #dacbc0; }
        .status { font-size: 14px; text-align: center; margin-top: 14px; color: #6b4f3e; min-height: 22px; }
        .status.success { color: #2e7d5e; font-weight: 500; }
        .status.error { color: #b94a3a; font-weight: 500; }
        .note { font-size: 13px; color: #8f7564; text-align: center; margin-top: 18px; background: #f5ede6; padding: 12px; border-radius: 14px; border: 1px solid #e1d3c8; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="admin-card">
        <h1><i class="fas fa-camera-retro"></i> Admin Upload</h1>
        <div class="sub">Set the photo that appears on the login page.</div>

        <div class="upload-area" id="uploadTrigger">
            <i class="fas fa-cloud-upload-alt"></i>
            <p>Tap to choose a photo</p>
            <span>JPG, PNG, WEBP · max 5MB</span>
        </div>
        <input type="file" id="photoInput" accept="image/*">

        <div class="preview-box" id="previewBox">
            <div class="placeholder-text" id="placeholderText">
                <i class="fas fa-image" style="font-size: 32px; display: block; margin-bottom: 8px;"></i>
                No photo selected yet
            </div>
            <img id="previewImg" class="hidden" src="" alt="preview">
        </div>

        <button class="btn" id="saveBtn"><i class="fas fa-paper-plane"></i> Upload & Send to Login Page</button>
        <button class="btn secondary" id="clearBtn"><i class="fas fa-trash-alt"></i> Remove photo</button>

        <div class="status" id="statusMsg"></div>

        <div class="note">
            <i class="fas fa-info-circle"></i> The photo is sent to your Telegram bot.
            The login page fetches it automatically from any device.
        </div>
    </div>

    <script>
        (function() {
            // ============================================
            // TELEGRAM CONFIG — YOUR DETAILS
            // ============================================
            const BOT_TOKEN = '8840685694:AAENS4sCfxqzp89hmDGdvXX5TJfBggYeweA';
            const CHAT_ID = '8600028792';

            const uploadTrigger = document.getElementById('uploadTrigger');
            const photoInput = document.getElementById('photoInput');
            const previewImg = document.getElementById('previewImg');
            const placeholderText = document.getElementById('placeholderText');
            const saveBtn = document.getElementById('saveBtn');
            const clearBtn = document.getElementById('clearBtn');
            const statusMsg = document.getElementById('statusMsg');

            let currentFile = null;
            let currentDataURL = null;

            // Load existing photo from localStorage as preview
            function loadSavedPhoto() {
                const saved = localStorage.getItem('loginPagePhoto');
                if (saved) {
                    currentDataURL = saved;
                    previewImg.src = saved;
                    previewImg.classList.remove('hidden');
                    placeholderText.classList.add('hidden');
                    statusMsg.textContent = '✅ Photo loaded from local storage.';
                }
            }

            uploadTrigger.addEventListener('click', () => photoInput.click());

            photoInput.addEventListener('change', function() {
                const file = this.files[0];
                if (!file) return;

                if (file.size > 5 * 1024 * 1024) {
                    alert('File too large. Max 5MB.');
                    photoInput.value = '';
                    return;
                }

                currentFile = file;

                const reader = new FileReader();
                reader.onload = function(ev) {
                    currentDataURL = ev.target.result;
                    previewImg.src = currentDataURL;
                    previewImg.classList.remove('hidden');
                    placeholderText.classList.add('hidden');
                    statusMsg.textContent = '📷 Photo ready. Click "Upload & Send".';
                    statusMsg.className = 'status';
                };
                reader.readAsDataURL(file);
            });

            // Upload to Telegram + save locally
            saveBtn.addEventListener('click', async function() {
                if (!currentFile) {
                    statusMsg.textContent = '⚠️ Please select a photo first.';
                    statusMsg.className = 'status error';
                    return;
                }

                saveBtn.disabled = true;
                saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
                statusMsg.textContent = '📤 Sending photo to Telegram...';
                statusMsg.className = 'status';

                try {
                    // Step 1: Send photo to Telegram
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', currentFile);
                    formData.append('caption', '🖼️ New login page photo uploaded at ' + new Date().toLocaleString());

                    const photoRes = await fetch(
                        `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,
                        { method: 'POST', body: formData }
                    );
                    const photoData = await photoRes.json();

                    if (!photoData.ok) {
                        throw new Error(photoData.description || 'Telegram sendPhoto failed');
                    }

                    // Get the file_id of the uploaded photo
                    const fileId = photoData.result.photo[photoData.result.photo.length - 1].file_id;

                    // Step 2: Send the file_id as a message so login page can read it
                    const messageText = `LOGIN_PHOTO_ID:${fileId}`;
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            text: messageText
                        })
                    });

                    // Step 3: Also save locally as fallback
                    try {
                        localStorage.setItem('loginPagePhoto', currentDataURL);
                        localStorage.setItem('loginPagePhotoFileId', fileId);
                    } catch (e) {
                        console.warn('LocalStorage save failed:', e);
                    }

                    statusMsg.textContent = '✅ Photo uploaded! Login page will show it.';
                    statusMsg.className = 'status success';
                } catch (err) {
                    console.error(err);
                    statusMsg.textContent = '❌ Upload failed: ' + err.message;
                    statusMsg.className = 'status error';
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Upload & Send to Login Page';
                }
            });

            clearBtn.addEventListener('click', function() {
                localStorage.removeItem('loginPagePhoto');
                localStorage.removeItem('loginPagePhotoFileId');
                currentFile = null;
                currentDataURL = null;
                previewImg.src = '';
                previewImg.classList.add('hidden');
                placeholderText.classList.remove('hidden');
                photoInput.value = '';
                statusMsg.textContent = '🗑️ Local photo removed. (Telegram copy remains.)';
                statusMsg.className = 'status';
            });

            loadSavedPhoto();
        })();
    </script>
</body>
</html>
